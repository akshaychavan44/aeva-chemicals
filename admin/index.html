<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Aeva Chemicals</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=password-toggle1">
</head>
<body>
  <!-- setup status -->
  <main class="screen screen--center" id="screen-setup" hidden>
    <div class="card card--narrow">
      <p class="brand"><b>AEVA</b> Admin</p>
      <h1>Not connected yet</h1>
      <p id="setup-message">Set up the Neon tables and admin credentials in Vercel. See ADMIN-SETUP.md in the repository.</p>
      <a class="link" href="../index.html">Back to the website</a>
    </div>
  </main>

  <!-- sign in -->
  <main class="screen screen--center" id="screen-login" hidden>
    <form class="card card--narrow" id="login-form" novalidate>
      <p class="brand"><b>AEVA</b> Admin</p>
      <h1>Sign in</h1>
      <p class="muted">Edit products, home page cards and job openings.</p>
      <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <div class="field">
        <label for="login-password">Password</label>
        <div class="password-field">
          <input id="login-password" type="password" name="password" autocomplete="current-password" required>
          <button class="password-toggle" id="password-toggle" type="button" aria-controls="login-password">Show password</button>
        </div>
      </div>
      <p class="message" id="login-message" role="alert" hidden></p>
      <button class="btn btn--primary btn--wide" type="submit">Sign in</button>
    </form>
  </main>

  <!-- editor -->
  <div class="screen" id="screen-editor" hidden>
    <header class="topbar">
      <p class="brand"><b>AEVA</b> Admin</p>
      <div class="topbar__right">
        <span class="muted" id="who"></span>
        <a class="btn btn--ghost" href="../index.html" target="_blank" rel="noopener">View website</a>
        <button class="btn btn--ghost" type="button" id="sign-out">Sign out</button>
      </div>
    </header>
    <div class="layout">
      <nav class="sidenav" id="sidenav" aria-label="Content to edit"></nav>
      <main class="content">
        <div class="content__head">
          <div>
            <h1 id="section-title"></h1>
            <p class="muted" id="section-intro"></p>
          </div>
          <a class="link" id="section-view" href="../index.html" target="_blank" rel="noopener">See it on the website ↗</a>
        </div>
        <p class="notice" id="section-notice" hidden></p>
        <form id="editor-form" novalidate></form>
      </main>
    </div>
    <div class="savebar">
      <p id="save-status" role="status">No changes yet</p>
      <button class="btn btn--ghost" type="button" id="discard" disabled>Undo changes</button>
      <button class="btn btn--primary" type="button" id="save" disabled>Save changes</button>
    </div>
  </div>

  <script src="admin.js?v=editor-sections1"></script>
</body>
</html>
